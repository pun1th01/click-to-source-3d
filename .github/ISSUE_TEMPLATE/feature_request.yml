name: Feature request
description: Suggest something new, or a better way to do something
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you're running into, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: How it could work, from where you sit.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Mockups, examples from other tools, or links.
