name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Without this the first red leg cancels the rest, and a break that is
      # specific to one platform or one Node version looks the same as one
      # that is not — which is the only reason the matrix exists.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The two supported LTS lines. 20 reached end of life in April 2026.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace integrity
        run: npm ls --workspaces

      # The root script, which builds in dependency order. `npm run build
      # --workspaces` sorts alphabetically and puts examples ahead of
      # vite-plugin, which fails from a clean checkout — which is every run
      # here.
      - name: Build
        run: npm run build

      # --reporter=verbose on every platform, not just the ones expected to
      # skip. A skip is reported as a name rather than added to a count, so
      # coverage that quietly stops running is visible in the log wherever it
      # happens. A conditional here would restore the blind spot on whichever
      # platform was left out.
      - name: Test
        run: npm test -- --reporter=verbose

  # The example app driven in a real browser: the inspector's hotkey, a
  # click, an edit written to source and surviving the reload, and an MCP
  # server finding the dev server with no configuration. Several fixes in
  # this project's history were found only by driving the real overlay;
  # this is that, on every push.
  e2e:
    name: end-to-end · ubuntu · node 24
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
